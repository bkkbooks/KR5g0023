body:
  text: 文昌九天開化品爾時九天開化主宰澄真正觀寶光天尊於重光赤奮若之歲日躔鶉尾月望東壁之辰降于蜀都寶屏山中和誠應之樓玄會玉虛之壇告鸞府侍仙真人劉安勝曰吾昔奉上帝玉敕職掌桂籍興文儒而擢貴品進賢德而佐明時故得掌隸天曹秩專司祿校録地府位司定貴詮量水府職在進賢應三府選舉吾總隸焉其選舉之歲吾同三元三官五方五帝三辰五斗列曜衆星參統三微研較氣運敕天曹定命定貴都司天府岱嶽地府北酆水府扶桑帝君集會九天開化文昌大都督府考定九州分野合升選擢魁名品籙三祿三貴三賢高下仍較其祖宗父母族屬己身世代歷劫有無大功隂隲孝行及有無積釁冤債結惡遺殃譴罪冢訟咒詛業根苦本魔基并五行命運所得定方數算悉皆注定若世代有大功隂隲孝行德基豐厚雖命運衰蹇以功行勝之即與添祿加年升入貴選進登祿籍若功隆德厚而寃債殃訟未息者則先令注祿入品名登賢籍俟福盛罪滅方得受祿若命運合得名秩克貴食祿而無隂德大功忠孝百行者即當退祿削貴落籍銷名以俟建乃立德積善集慶方與注入貴籍增祿成名其或文儒賢士知命悔過進德修業運氣貴而隂功微業緣縳而寃債纍鬼邪窒其進取妖魔障其靈鑒者吾當授以文昌上宫大洞寶籙消諸魔障啓沃身心此文昔祕於元始玉清聖境浩劫天宫金闕玉房雲錦之囊授之於玉宸大道君太上老君授受於紫微帝君暨太一元君次傳於聖祖軒皇嗣於帝堯大舜神禹禹授於劉月月授於王經經授於彭太極太極授於鄧元元授於劉誼誼授於劉洞真洞真授於王遠遠授於彭曉曉授劉希嶽希嶽授於蘭公翹公翹授於彭德直由是萬聖千真皆獲受度宿緣積慶者求師傳受必當誠恪投陳遵依科格金繒法信以固約盟其授籙之師必經佩持三洞四輔九天金籙之人方可依科付度如德秩尚微功勳未著不可妄稱師範輕泄靈文持受此籙依按修行可以解纍世冤結可以止冢訟宿殃斷絶惡業地根摧伏魔基苦本奪靈鑒之神潜匿晦文業之鬼遁逃亂性之妖滅形障貴之邪挫首若命運凶衰定分卑淺得此祕文敬而勿怠精勤香火存念經訣上消天災下禳地禍增延祿算斷絶邪魔神性清明文華秀發若命運未貴文業未舒遵奉寶籙依按修持惟務濟人馘毒治病救及三百六十人者積成大功高升祿秩注入貴品進在賢籍當輔佐明時得為至貴之臣祿及子孫光榮族屬若能修持經籙中妙行法門常令身心清淨神氣精明年齒既高當得太隂鍊形得尸解之道不墮輪轉升入仙都位為真人凡清信之士受吾籙者吾即奏上玉帝金闕注録三元曹府祿貴賢籍使其身心究竟不昧應入貴籍輔佐明時所有九天較定天曹地府水府三祿三貴三賢科品宣傳于後上元天曹嶽府司祿分一科三品一司天祿科上品紫微天官中品太微斗官下品少微星官二司人祿科上品王公𡖖侯爵中品方伯監牧爵下品百官散秩爵三司幽祿科上品嶽府官僚中品酆都官僚下品扶桑官僚中元地府酆都定貴分三科三品一司上貴科孝行上品守節中品隂德下品二司中貴科仁慈上品廉義中品德行下品三司下貴科賢達上品祖德中品文學下品下元水府扶桑進賢分三科三品一司上賢科至孝上品大忠中品慈仁下品二司中賢科廉義之賢上品禮法之賢中品智度之賢下品三司下賢科篤行之賢上品才學之賢中品分定之賢下品已上科品並以較録世人如入科品者即與注祿定貴進在賢籍吾當遣潢譜仙官翊贊善功開明神鑒仍遣儲佐列神斷除魔障授之天章玉文鎮護身田兆祥應㝱降中皇真氣啓沃身心敕安志益慧之神安定百關開聰導明進其才華通其靈鑒一如文昌科法律令文昌天潢譜系品帝君聖誥金闕上相檢校太師混元內輔三清上聖大都督府都統三界隂兵行便宜事管天地水三界獄事收五嶽四瀆真形虎符龍券總諸天星曜判桂祿嗣籍上仙英顯元皇真人司祿職貢舉真君洞照通真先生編修飛仙列籍掌混元造化輪回六道救苦救難慈尊玉清內境清淨道真身見紫雲岩手持如意杖統御萬靈普濟諸苦大仁大孝大聖大慈無上不驕樂天帝都總混天誠心接物萬天教主隨願慈應天尊九天定元保生扶教開化主宰長樂永佑靈應大天帝君掌五湖四海總十二河源水府運使澄真正觀注祿定籍寶光慈應治世顯道保安拔罪更生永命扶善濟苦消劫行化純一顯應天尊帝君張姓諱亞上應張翼二宿生於周初吳會之地以二月三日聖誕混元父母天地同根胞胎骨肉一氣分身綱維造化洞照無垠宣弘大道濟佑彝倫靈光下降百福來臻斥除邪障正氣長存急急一如文昌律令顯慶慈佑儲真衍慶天尊大聖長生壽母元君照德積慶慈懿儲祥元君昭懿沖和洞妙元君嗣德文昌衍慶真君文昌靜應天君昌德文昌司祿真君文昌嗣慶天君淑真妙靖文昌萬壽天君聖宫懿淑四宫夫人文昌積慶真人文昌積慶天君文昌襲慶真人文昌襲慶天君靈山大神張忠嗣蜀北門山神張仲子劍山大神張勳蜀劍山神張孝仲金馬山神張烈趙王劉如意文昌紹應侯文昌昭應公文昌承應公文昌寶靈公文昌了喜夫人文昌妙應夫人文昌柔貞公主右聖宫曹治八十一仙官領兵隨籙度文昌儲佐列神品佐神英惠公顯應協惠夫人神嗣濟美公神嗣濟惠公贊福夫人靖順夫人文昌興國大太尉文昌左右二太尉文昌左右二將軍文昌如意大將軍文昌左右二丞相文昌左右二僕射文昌左右二太史文昌三公九𡖖文昌六曹尚書文昌御史大夫文昌上將真君文昌次將真君文昌貴相真君文昌司命真君文昌司祿真君文昌司中真君文昌司貴真君文昌司文真君文昌定武仙官文昌定貴仙官文昌魁星仙官文昌解星仙官文昌應瑞仙官文昌降㝱仙官文昌貢舉仙官文昌檢隂功仙官文昌定豫奪仙官文昌增福祿仙官文昌四直功曹文昌傳奏功曹文昌掌桂籍童子文昌應㝱大將軍山王明化侯夫人主八景瑶華院仙官鳳凰匱土地靈應侯右儲佐列神嚴肅威儀分真降靈衛護兆身一如律令劍門山神白圭西陲飛越山神廉玠西域雪山神白輝劍門山神公元長青黎山神吳肩白龜山神義敏大岷山神衛廉青城山神希夷公岷山洞天神彭元岷山山神何機大峨山神曹英小岷山神虞觀峨眉山神李善猷巫山山神王玄父分樟山神張煒都大總部山神王秀水石犀龍洞李若水灌口太守潭龍神劉成之西蜀都城隍韋臯益州社令神杜其昌西蜀劍南社長鄧文西蜀都社神杜宇西蜀西鎮社公章鳳凰山神獨孤正蜀里域神段秀岷山龍神勾盤恬灌口伏龍潭神蹇竈青衣龍神景伯仁越巂山神蕭福北門山神張叔和西海龍神白龜憫洞庭龍神景淵君山山神唐豐吳海水神彭暹蜀里域神虞竒叔卭州里域神孫和叔蜀檢孝神崔瑄婆娑巴王神軒安行檢孝土地神白致一漢水邑里土神康潮王苴饒邑神公孫長巴西邑神和來孫白馬邑神柏之堅苴邑神蘇公長七曲山神全禮右七曲鳳凰諸山佐順龍神四十五部各領兵度文昌天章玉文品南斗文昌斗章太極妙化真文玄機掌天天文護地地圖理水水府三元共敷紫庭大告天地咸敷如意在心玉壓同居此文隱語三才並居禮樂既作混沌已舒大羅透徹乘景躡虛上智有學訓之下愚急急一如玉文輪掌律令子上沖午為之端門申宫加酉出入為尊辰來求戌魁罡正元卯上通寅天元地輪丑內尋巳闔闢兩全未中得亥伏逆相存右隱訣祕咒出文昌三氣至真之文得之者宜齊心鍊氣捨妄從真絶口是心非之無諸邪想自然增益聰明文華奮發越章天印可以佩受寶而敬之辟惡除邪消諸魔障文昌上宫越章玉文上制天根中檢星辰下察地水通幽徹冥開仁去鈍辟斥妖氛剪却三尸馘滅九蟲魑魅潜藏旱潦無迍受持不怠白日同升文昌中皇生氣品中皇九道司命生氣符圖人生受命禀質性根不一或英華文明者宿緣之慶頑愚迷鈍者宿業所致考功行者百僅一二進玄機者千無二三如皈心嚮道參文究玄當佩生氣符圖誦豁落真言自然感召文昌仙官神吏衛護兆身增益智慧詞藻焕爛進祿成名矣子丑生人趨文慕玄敕天罡八學靈官附身心寅生人學文進玄敕威烈北府真官附身心卯生人通文究玄敕定神養鋭位仙伯附身心辰生人向學入玄敕安惠叶文真人附身心已生人習經耽玄敕仁濟威廣仙郎附身心午生人學經博玄敕寶益定光太史附身心未生人篤學明玄敕太華六行尚書附身心申生人進鸞升玄敕元命總轄真𡖖附身心酉生人習文趨玄敕東華繡衣使者附身心戌亥生人明經演玄敕文昌義濟王附身心立春前後管乾立夏前後管離立秋前後管巽立冬前後管坎已上通玄究微之士不可不考其源方知禀受貴賤等差命分深淺方寸湛然功生愧負則所求無不如意切宜詳之文昌生氣合形總真元命豁落真言唵哩唎哪阿息吸畔訶訶魁阿魒𠰢菩提適洞吒喃唧虛空巡腔辜頂越轟轟霓霓閃閃爍爍光文華清定意疾縛七星竅堯近都黃神摩訶般若定丁都律吐納真元攝混元真伯通悟玄機一如律令文昌定志益慧品文昌司祿定貴安神益慧神咒東河之陽西林之南有神王華受命元皇主鎮文昌貴司之男八會振文九光明儒太一定策玉女輔書龍女十千文房佐軀太吏百萬定心握樞使我一身與靈通明道合乘時萬章洞輝謁帝埏文仰契皇經使我策宣坐致升平吉日受符披章行功八威助膽龍曜飛空十聰益慧豁落除蒙意寧志顯萬化踈通神豫之鑒天佑之文貴宜乘之祿宜與增使我大成文華益昌擷藍龍姬保宣正陽一誦玉章九天開光萬化洞啓神明主張使我神功高致忠良一如律令右玉章是名九天開化安神益慧神咒乃無上浩劫大洞之文言無韻麗曲無華宛深不可測妙不可言下世莫能聞凡濁莫能傳祕之紫陽玉笈雲錦之囊昔九龍始祖三元太素道君於元始天尊前主盟請佩而傳於上元夫人雲華夫人使下教世間通儒賢士誠恪佩誦即得文彩昭明神豫之鑒高登貴選佐助皇猷廣振文風宣揚正化永為身寶準教奉行高上大洞文昌司祿紫陽寶籙卷上
