front:
  text: 高上大洞文昌司祿紫陽寶籙卷上物二某貫居住奉道信士某詞稱本命某年某月某日某時建生上屬北斗某星君王照即日虔誠恭詣度師教主天師大真人門下拜受高上大洞文昌司祿紫陽寶籙一部皈身佩奉誓以欽崇正教律己修身增益才華開明鑒識斷除魔障斥逐邪妖顯擢科名進登祿位受佩之後不敢輕泄玄文怨咎道師如負盟言一依文昌上宫科法律令
