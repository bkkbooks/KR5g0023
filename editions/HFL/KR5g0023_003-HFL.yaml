body:
  text: 文昌蒼天育神品應春分四陽之炁東方青霄主宰文昌大洞紫陽玉章第一紫陽開玉笈元始出金章洞闢青華府昭明太一光蒼晶回七宿萬炁贊文昌頡明顓佐命通濟永無疆此玉章每旦調聲正炁誦之九過生育元神名登貴品東方蒼天開化主宰青霄育神功曹一人吏六人大洞天騶甲卒兵萬人度文昌陽天輔文品應立夏六陽之炁東南方碧霄主宰文昌大洞紫陽玉章第二大洞迴風振龍威六氣宣紫陽敷玉策定貴下三元辟斥隂魔障開明正性傳斯文垂寳運通濟永無愆此玉章每旦平心正炁誦之九過輔益文學名進賢科東南方陽天開化主宰碧霄輔文功曹一人吏六人大洞天騶甲卒兵萬人度文昌炎天明眞品應夏至一隂之炁南方丹霄主宰文昌大洞紫陽玉章第三九華敷妙炁太一輔丹元開化明天斗靈光灼至賢帝心符寳策神性合龍編會集中和景斯文保大全此玉章每旦頤神調炁誦之九過開明眞性穎悟良能南方炎天開化主宰丹霄明眞功曹一人吏六人大洞天騶甲卒兵萬人度文昌朱天通玄品應立秋三隂之炁西南方景霄主宰文昌大洞紫陽玉章第四建輝凝八野景策輔中皇丹田舒靈炁雲華脅智光欹盧翦魔力眞宰啓天章文華資大業通濟永弘昌此玉章每旦調神理炁誦之九過通徹玄機神光自生西南方朱天開化主宰景霄通玄功曹一人吏六人大洞天騶甲卒兵萬人度文昌昊天入賢品應秋分四隂之炁西方玉霄主宰文昌大洞紫陽玉章第五紫陽敷太昊華質自資深月母生金后玄天益帝心太眞歌舞翮牝牡合重隂文道由昌盛彤芝茂玉林此玉章每旦平心正炁誦之九過入登賢籍克悟大道西方昊天開化主宰玉霄入賢功曹一人吏六人大洞天騶甲卒兵萬人度文昌幽天立德品應立冬六隂之炁西北方太霄主宰文昌大洞紫陽玉章第六北號名幽幽文豪枕太霄上天開大化紫極正魁杓元父生壬好文昌發洞謡九龍宣貴籍妙用益玄寥此玉章每旦調神正炁誦之九過建立德基才猷超邁西北方幽天開化主宰太霄立德功曹一人吏六人大洞天騶甲卒兵萬人文昌玄天應貴品應冬至一陽之炁北方紫霄主宰文昌大洞紫陽玉章第七玄一弘元始靈通大妙神弘文翊昌運啓武鎮魔軍翕合生神秀英姿與日新顓陽參大化通濟輔天人此玉章每旦調聲平炁誦之九過上應貴選神助文捷北方玄天開化主宰紫霄應貴功曹一人吏六人大洞天騶甲卒兵萬人度文昌變天進祿品應立春三陽之炁東北方琅霄主宰文昌大洞紫陽玉章第八變羡崑崙頂三神覆北酆琅霄專主宰開化翊成功大洞陽符質清生化紫彤膠修流梵寳通濟永昌隆此玉章每旦平心理炁誦之九過進擢禄司揚名濟世東北方變天開化主宰琅霄進禄功曹一人吏六人大洞天騶甲卒兵萬人度文昌鈞天成功品應四季二陽五隂二隂五陽之炁中央神霄主宰文昌大洞紫陽玉章第九太極鈞天母中央鎮斗樞八元生一炁九道會中書應化文華盛開明帝德餘斯文新大業通濟利皇居此玉章每旦調聲正炁誦之九過行修功顯萬願克成中央鈞天開化主宰神霄成功功曹一人吏六人大洞天騶甲卒兵萬人度右大洞文昌紫陽玉章九品每旦平心定志調聲正炁稽首恭禮文昌司禄眞君几前各誦九過自然感徹諸天當得九霄定貴司禄功曹仙吏天騶甲卒下降翊衛兆身滅除障礙進文達德顯名著功輔佐皇風宣行大化一如紫陽律令文昌應㝱八圖品虚靖天師曰此文乃無上天曹文昌司禄眞君九天開化主宰於先劫拜三元太素道君上元夫人靈華上宫夫人傳授此籙號文昌司禄輔文應㝱紫陽寳籙昔秘於玉清大有金闕玉房之中紫陽雲錦之囊敕九天儲福尊神侍衛天騶甲卒護籙司命司禄眞君予奪司都天大丞相予司奪司定貴成功司九霄功曹官吏等衛護玄文明取儒士以應時選贊翊皇猷佐運昇平歷世寳之受此文者不虚其傳必先形諸㝱想或日見異瑞爲徴兆乃受籙之報也若得㝱應必登貴品矣玉白貓馬應應白黃鹿牛應應大黑鬼犬應應法怒斬擊戊三虎人應應司禄譜云已上八圖㝱應或顯見於朕兆間或示像於寢㝱中皆爲竒瑞必獲貴選略述十徴以見先兆唐德宗時姚煒乃崇之後力學能文壯志未諧一日得遇方士賀達即知章之玄孫也授以斯籙未授間煒㝱枕中有白猫及授籙開閲果有玉猫應之徴是年登第後至侍從蜀廣政中綿州高慶孫㝱乘牛扣角因與玉局觀道士胡道遠語及此㝱道遠賀曰君今年必中解科蓋刀牛者解字也㝱此爲瑞果如其言遂中高選唐昭宗時士人朱涣者文學俊秀受此籙於宗人朱道元㝱斬五虎次年登第官至清近宋太宗景德中周良輔受此籙於萊州道士劉若拙㝱逐群鹿爲鹿所踐斃路中㝱驚其年登科官至帥臣神宗時眉州蘇軾得此籙於郷東墓頤山處士黄若水其父洵㝱見書笥中有大鬼頭驚而覺其年軾兄弟俱登科名蘇軾之次子迨一夕㝱擊三人立死以爲不祥語其兄邁邁賀曰奉慶三元之選必吾弟也果如其言洪州黄庶字亞夫㝱黑犬護其足蓋庶受此籙於齊先生坐下以爲吉兆當年登第官至太中大夫大理寺丞晁公武字子正上元夜㝱擊死同齋三士人被官吏縳之有司及至獄見其兄公愬字子西已先縛在獄驚覺而不言因到利州寳峰遇魯道士遂出示此籙覽至應㝱圖有怒擊三人應之徴遂設醮受此籙後伯仲果中高第龐武太師未遇時遊洛西鳳林菴有道士蒙吉者與之飲是夕酒酣宿於菴中㝱爲白馬所齧甚痛及覺以語吉吉曰公得八圖之應乃出此籙示之就以傳授其年登科不十五年官至執政父子皆爲太師建炎末卭州劉浩然少讀書謀進取㝱司禄眞君授以文昌之籙既覺録以記之遂詣龍虎山拜謁於三十代天師求受此籙天師取以示之天師曰此籙非子成名子當傳之度及三貴受訖不能詳其言紹興中浩然行三洞法籙符藥靈顯能出神拜章逆知人未來休咎爲當時士貴所稱隆州虞允文字彬父聞其名而扣之浩然謂允文曰君中年榮貴必至執政可以受籙扶文進業允文曰何籙可受浩然乃以此籙授之後一年允文在跨鰲齋中㝱擊三人卒而流汗及披籙中見有此徴次年果策名在三元之魁後爲宰相凡賢士名儒受籙之前先得㝱徴便當拜師求受此籙則以迎合天意必獲功名之報若猶豫生疑不能信奉則予奪司之神伐人之靈鑒削人壽禄終無成也若受籙之後有此㝱徴皆當成名㝱應於受籙之前爲上㝱應於受籙之後者次之若敬奉此籙則輔文進業生九道文昌之炁使宿昔寃訟自雪祖宗殃注不胤神不能奪其鑒魔不能障其才猷命運之凶纏不能加惡煞不能肆其威定志開心有神益慧科名顯達禄及子孫若輕慢靈文妄示非人則三官鼓筆罪報不輕高上大洞文昌司禄紫陽寳籙卷下請籙法詞高上大洞文冒司禄紫陽寳籙法詞維某年月日具郷貫居住奉道弟子某人本命某年月日時建生上屬北斗某星君主照即日虔誠恭詣度師教主天師大眞人門下拜受高上大洞文昌司禄紫陽寳籙一部敬奉修行伏以玉篆瓊書實胚胎於太極金臺桂籍悉隸屬於文昌藴妙凝玄含精毓秀故造化生成默而有應於隂陽消長合以無爲自流形符張翼之精累弘教翊君巨之道由是功高金闕司禄籍於天曹貴掌瑶圖示銓衡於人爵昭垂妙範統制文綱黜陟無私古今有賴伏念某生逢昭代際遇眞風稽首投誠願佩九天之祕典進文益智冀通一貫之微言志早遂於青雲盟有同於白日仰希付度俯謹修崇某下情無任懇禱之至謹詞天師門下據弟子某齎持質信詣道自陳求受高上大洞文昌司禄紫陽寳籙一部終身敬奉及請眞師寳諱符圖經訣依按修行即日告盟天地立誓三官破券分環依科傳授給付如後籙一部上中下三卷九天開化品天潢譜系品儲佐列神品天章玉文品中皇生炁品定志益慧品簡閲寳圖品司禄玉符品定貴金簡品進賢玉策品消魔金篆品元綱演化品東壁璇璣品宫曹騎衛品蒼天育神品陽天輔文品炎天明眞品朱天通玄品昊天入賢品幽天立德品玄天應貴品變天進禄品鈞天成功品應㝱八圖品儀式盟眞合同環券一封正一修眞㫖要節目祖玄眞三師寳號祖師九天開化主宰慈應大帝大慈更生水命天尊玄師天府掌水陸都轉運使緫桂禄二籍孚澤大帝眞師大成至聖文宣王文昌皇人九天玄聖道君經籍度三師法諱經師上清三洞經籙南曹眞士玉府上𡖖都天大法主嗣漢四十二代天師張一正常籍師上清三洞經籙太極執法眞宰靈寳領教眞人都天大法主嗣漢四十三代天師張宇初度師上清三洞寳籙靈寳領教玄化眞人南曹執法仙宰都天大法主嗣教四十四代天師張宇清臨壇師法名監度師保舉師證盟師右伏以文昌祕典掌九天司禄之銓衡大洞靈章闡七曲眞仙之治化雲篆五文而開廓金書八角以垂芒昭昭乎帝御所臨洋洋乎神明如在修之則貫通至理悟之則超契玄微惟以進文業於身惟以顯功名於世稱揚莫盡藴奥難名某誠意正心修身謹行遵承聖訓未能寡過而寡尤皈奉眞宗曷悟常清而常靜伏願禄登桂籍名上蘂宫一念通眞徹明經之㫖趣三元定貴列上品之科名恪謹盟言永爲身寳倘違初志甘伏憲章高上大洞文昌司禄紫陽寳籙法詞
