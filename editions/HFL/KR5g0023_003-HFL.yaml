front:
  text: 高上大洞文昌司禄紫陽寳籙卷下物四據某貫居住奉道信士某詞稱本命某年月日時建生上屬北斗某星君主照即日虔誠恭詣度師教主天師大眞人門下拜受高上大洞文昌司禄紫陽寳籙一部皈身佩奉行持端冀開明眞性通悟本心弗措於學問辨思勿非於視聽言動進修德業超益才華名成而贊輔皇猷禄遂則宣明正化致君於唐虞之上濟民於成康之時封及祖宗澤垂後裔誓勤修奉永佐昇平如或背盟一依九天主宰元降律令
  hash: sha256:e8d2536686e395b45686ed9e4e88100521e61d537c3d32a53cf1cd1b6bf5391c
