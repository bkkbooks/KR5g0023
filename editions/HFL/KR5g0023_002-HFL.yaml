front:
  text: 高上大洞文昌司禄紫陽寳籙卷中物三據某貫居住奉道信士某詞稱本命某年月日時建生上屬北斗某星君主照即日虔誠恭詣度師教主天師大眞人門下拜受高上大洞文昌司禄紫陽寳籙一部皈身佩奉誓以崇敬帝眞遵依科戒進修文業積習善功悟太上之玄機消除魔障登文昌之貴籍顯達科名濟世安人保身利物有違科約以身謝天地水三官一如玄科律令
