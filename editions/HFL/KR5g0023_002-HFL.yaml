body:
  text: 文昌簡閲寳圖品夫文昌寳圖乃自混沌初分太元高上玉皇之炁結而成文丹霞碧雲自然成章出於元始天王同出而異名閟於上清龍羅玄鸞之臺安紫陽九光鳳華之闕文昌皇人玄元道君夫子爲文昌圖闕帝主命此寳圖生化文儒賢士輔佐聖統王道使英俊文物世代克昌佩受之士即得玄炁降神文華清秀才識通明心光自然無所不至百千障礙不能壅蔽當有侍圖金童玉女天官神吏等三百六十人隨符護身子冝敬奉焉文昌侍圖金童三百六十人度文昌侍圖玉女三百六十人度文昌侍圖天官三百六十人度文昌侍圖神吏三百六十人度文昌三五定命吏三百六十人度文昌三五定心吏三百六十人度文昌三五定志吏三百六十人度文昌三五定意吏三百六十人度文昌三五定聦吏三百六十人度文昌三五定慧吏三百六十人度文昌三五定膽吏三百六十人度文昌三五和神吏三百六十人度文昌三五合神吏三百六十人度文昌三五通達吏三百六十人度文昌三五開鑒吏三百六十人度文昌三五通識吏三百六十人度文昌三五却邪吏三百六十人度文昌三五除障吏三百六十人度文昌三五生炁吏三百六十人度文昌三五文章吏三百六十人度文昌三五開性吏三百六十人度文昌三五注禄吏三百六十人度文昌應㝱吉神吏三百六十人度文昌佐賢龍女吏三百六十人度文昌輔文玉女吏三百六十人度文昌輔文水吏玉妃一人度文昌黄神玉印太一使者八人度文昌越章鐶天玉女八人度文昌八景瑶華院印力士一人度文昌主劍神王玉女八人度右文昌寳圖玉符給付弟子某撥隸金童玉女仙官神吏如遇三元日齋心沐浴投誠醮祭以求吉㝱進名科品一如盟約信受奉行文昌司祿玉符品上元天曹司禄眞君一人上元天府司禄眞君一人上元天府司天禄吏八十一人上元天府司加天禄吏八十一人上元天府司人禄吏八十一人上元天府司加人禄吏八十一人上元天府司天爵吏八十一人上元天府司加天爵吏八十一人上元天府司人爵吏八十一人上元天府司加人爵吏八十一人上元天府司幽禄吏八十一人上元天府司加幽禄吏八十一人上元天府司幽爵吏八十一人上元天府司加幽爵吏八十一人右司禄玉符給付弟子某佩受修持崇奉文昌司禄眞君誦詠大洞紫陽玉章自然感召仙官神吏增益智慧通才輔文進登禄位一如盟言文昌定貴金簡品始青天開化主宰定貴眞君太青天開化主宰定貴眞君始丹天開化主宰定貴眞君太丹天開化主宰定貴眞君始素天開化主宰定貴眞君太素天開化主宰定貴眞君始玄天開化主宰定貴眞君太玄天開化主宰定貴眞君中央大梵天開化主宰定貴眞君中元地府定上品貴人吏三十六人中元地府定中品貴人吏三十六人中元地府定下品貴人吏三十六人中元地府定帝聖貴人吏三十六人中元地府定王爵貴人吏三十六人中元地府定公爵貴人吏三十六人中元地府定侯爵貴人吏三十六人中元地府定伯爵貴人吏三十六人中元地府定男爵貴人吏三十六人中元地府定子爵貴人吏三十六人中元地府定郞官貴人吏三十六人中元地府定大夫貴人吏三十六人中元地府定父母封爵吏三十六人中元地府定官爵官吏三十六人中元地府定蔭子貴吏三十六人中元地府定封妻爵吏三十六人中元地府定富貴全籍吏三十六人中元地府定貴族官吏三十六人文昌掌禄籍判官主簿書列定上品貴人一千二百人隨籙度右定貴金簡眞君仙吏依科傳授付弟子某敬奉修持當得書名金簡注上中元定貴籍中列字上品榮身享禄顯達功名忠孝君親流澤後裔一如盟約奉行文昌進賢玉策品下元水府進上科上品貴人吏從一百二十人度下元水府進上科中品貴人吏從一百二十人度下元水府進上科下品貴人吏從一百二十人度下元水府進中科上品貴人吏從一百二十人度下元水府進中科中品貴人吏從一百二十人度下元水府進中科下品貴人吏從一百二十人度下元水府進下科上品貴人吏從一百二十人度下元水府進下科中品貴人吏從一百二十人度下元水府進下科下品貴人吏從一百二十人度下元水府進賢女吏神妃從一百二十人度下元水府進賢龍女神妃從一百二十人度右進賢玉策水府官吏龍女神妃衛護受籙弟子某精勤佩奉進德立功上佐皇猷垂名昭世一如盟科奉行文昌消魔金篆品護國消魔金篆中功曹神吏第一功曹輔興領將一萬人度第二功曹荀明領將一萬人度第三功曹費陟新領將一萬人度第四功曹龐玠領將一萬人度第五功曹魯鏐領將一萬人度第六功曹宋炳領將一萬人度第七功曹高逸領將一萬人度第八功曹趙櫓領將一萬人度第九功曹趙期領將一萬人度第十功曹王石領將一萬人度右消魔金篆功曹仙吏一合下降擁護弟子某鎮衛心田開明眞性進貴進禄克亨克通以太和眞炁止訟消殃以大洞仙兵摧魔斥惡解釋寃仇業債斷絶苦本地根文德日昌才名顯達進登貴籍輔佐明時一如文昌科法律令文昌元綱演化品紫微上宫文昌太極都督靈章上可保制劫運宣化天機中可以飛鸞演化濟世安民下可以保身護命度厄延年得悟之者證聖成眞矣文昌東壁璇璣品東壁圖書瓊瑶玉文五運合景東壁圖書先天先地合璧連珠正眞生炁運合化車修文偃武洞達玄都少微處士君子多居巨今學譜願入仙衢澄眞正觀如意寳書唵魒𩳐急急一如溥天大元帥口敕律令右東壁圖書瓊瑶玉文上應九天自然之道爲文昌府玄祕之文得之者開明神鑒進益才華星宿垂光降祥生炁滅諸障碍消諸不祥一如大洞文昌科法律令文昌宫曹騎衛品文昌大洞寳籙建節大將軍天騶甲卒神吏一萬人度